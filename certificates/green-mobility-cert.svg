  <rect x="560" y="640" width="80" height="80" fill="#1E293B" rx="6"/>
  <rect x="575" y="655" width="20" height="20" fill="#FFFFFF"/>
  <rect x="605" y="685" width="20" height="20" fill="#FFFFFF"/>
  <text x="600" y="745" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Validity authorized by Skill India Digital Hub</text>
  
  <text x="1040" y="790" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" text-anchor="end">Certified on: 19/04/2026 15:40</text>
