  <rect x="25" y="25" width="1150" height="800" fill="none" stroke="#C59B27" stroke-width="14" rx="10"/>
  <rect x="45" y="45" width="1110" height="760" fill="none" stroke="#D4AF37" stroke-width="3" rx="6"/>
  
  <!-- Header Logos Area -->
  <text x="120" y="100" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" fill="#0F172A">Reliance Foundation</text>
  <text x="120" y="125" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#64748B">SKILLING ACADEMY</text>
  
  <text x="560" y="100" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24" fill="#1E293B">Skill India</text>
  <text x="560" y="122" font-family="'Inter', sans-serif" font-size="13" fill="#E11D48">कौशल भारत - कुशल भारत</text>
  
  <text x="1000" y="100" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" fill="#0F172A">N·S·D·C</text>
  <text x="1000" y="122" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">REIMAGINE FUTURE</text>

  <!-- Title -->
  <text x="600" y="220" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#1D4ED8" text-anchor="middle" letter-spacing="3">CERTIFICATE OF COMPLETION</text>
  
  <text x="600" y="280" font-family="'Inter', sans-serif" font-size="18" fill="#475569" text-anchor="middle">This is to certify that</text>
  
  <!-- Recipient -->
  <text x="600" y="340" font-family="'Cinzel', 'Space Grotesk', serif" font-weight="700" font-size="44" fill="#0F172A" text-anchor="middle">Sujal Singh</text>
  <line x1="350" y1="360" x2="850" y2="360" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <text x="600" y="410" font-family="'Inter', sans-serif" font-size="18" fill="#475569" text-anchor="middle">has successfully completed the online skilling course on</text>
  
