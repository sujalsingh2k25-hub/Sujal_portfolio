  <text x="600" y="470" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="32" fill="#E11D48" text-anchor="middle">Green Mobility and Its Applications</text>
  
  <text x="600" y="530" font-family="'Inter', sans-serif" font-size="16" fill="#64748B" text-anchor="middle">a course offered by Reliance Foundation Skilling Academy through Skill India Digital Hub.</text>
  
  <!-- Course Duration & Date -->
  <rect x="360" y="570" width="480" height="40" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="600" y="595" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">Course completed Apr 19, 2026 | 90 Hours</text>
  
